# Modified for the independent Linux desktop project.

name: 🐛 Bug Report
description: Report a reproducible bug or regression.
labels:
  - 'needs-triage'
  - 'type: bug'

body:
  - type: dropdown
    attributes:
      label: Project
      description: Which part of the repository is affected?
      options:
        - Linux desktop application
        - Linux Bluetooth or BLE transport
        - Linux local-network transport
        - Packaging or installation
        - Upstream Nearby library
        - Other
    validations:
      required: true

  - type: input
    attributes:
      label: Application version
      description: Release tag, AppImage filename, or commit hash.
    validations:
      required: true

  - type: input
    attributes:
      label: Linux environment
      description: Distribution/version, kernel, desktop, and Wayland or X11.
      placeholder: Ubuntu 24.04, kernel 6.8, GNOME 46, Wayland
    validations:
      required: true

  - type: input
    attributes:
      label: Hardware and peer device
      description: Bluetooth/Wi-Fi adapters and the sending or receiving device.
      placeholder: Intel AX211; Android device and OS version

  - type: textarea
    attributes:
      label: What happened?
      description: |
        Please provide as much info as possible. Not doing so may result in your bug not being addressed in a timely manner.
    validations:
      required: true

  - type: textarea
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    attributes:
      label: How can we reproduce it (as minimally and precisely as possible)?
      placeholder: |
        Example bug report:
        1. Open the Linux application and enable receiving.
        2. Select the Linux device from the peer device.
        3. Accept the transfer and observe the failure.
    validations:
      required: true

  - type: dropdown
    attributes:
      label: How often does this bug happen?
      description: |
        Following the repro steps above, how easily are you able to reproduce this bug?
      options:
        - Every time
        - Often
        - Sometimes
        - Only once
    validations:
      required: true

  - type: textarea
    attributes:
      label: Standalone code to reproduce the issue
      description: Provide a reproducible test case that is the bare minimum necessary to generate the problem.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Remove device names, addresses, file names, and other private data before pasting. This field is formatted as code.
      render: shell

  - type: textarea
    attributes:
      label: Anything else we need to know?
