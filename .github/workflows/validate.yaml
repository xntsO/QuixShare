name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: true
  CC: /usr/bin/clang-21
  CXX: /usr/bin/clang++-21

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77 # 0.18.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true

      - name: Check release hygiene
        run: ./util/check_release_hygiene.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg wget
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/apt.llvm.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-21 \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            libsystemd-dev \
            libcurlpp-dev \
            libasound2-dev \
            libunistring-dev \
            libldap-dev \
            libkrb5-dev \
            libgpg-error-dev \
            libbluetooth-dev \
            libxkbcommon-dev \
            patchelf \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-wayland \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libqrencode-dev

      - name: Build Connections
        run: |
          bazel build \
            --@com_google_protobuf//bazel/toolchains:prefer_prebuilt_protoc=true \
            --copt='-DGITHUB_BUILD' \
            //connections:core

      # - name: Build Presence
      #   run: |
      #     bazel build \
      #       --check_visibility=false \
      #       --spawn_strategy=standalone \
      #       --cxxopt=-std=c++20 \
      #       --host_cxxopt=-std=c++20 \
      #       --@com_google_protobuf//bazel/toolchains:prefer_prebuilt_protoc=true \
      #       --copt='-DGITHUB_BUILD' \
      #       --copt='-fvisibility=hidden' \
      #       --cxxopt='-fvisibility-inlines-hidden' \
      #       //presence

      - name: Build Nearby Sharing Linux
        run: |
          bazel build \
            --@com_google_protobuf//bazel/toolchains:prefer_prebuilt_protoc=true \
            --copt='-DGITHUB_BUILD' \
            //sharing/linux:nearby_sharing_cli

      - name: Test Linux release-critical components
        run: |
          bazel test \
            --@com_google_protobuf//bazel/toolchains:prefer_prebuilt_protoc=true \
            --copt='-DGITHUB_BUILD' \
            //internal/platform/implementation/linux/tests:bluetooth_classic_medium_test \
            //internal/platform/implementation/linux/tests:network_safety_test \
            //internal/platform/implementation/linux/tests:stream_test \
            //sharing/linux/app:application_controller_test \
            //sharing/linux/app:backend_test \
            //sharing/linux/app:native_file_logging_test

      - name: Build Linux desktop packaging target
        run: |
          bazel build \
            --@com_google_protobuf//bazel/toolchains:prefer_prebuilt_protoc=true \
            --copt='-DGITHUB_BUILD' \
            //sharing/linux/app:appimage

